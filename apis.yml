aid: sinay
url: https://raw.githubusercontent.com/api-evangelist/sinay/refs/heads/main/apis.yml
name: Sinay
kind: company
description: Sinay is a maritime data and analytics company whose Developers Platform
  exposes a marketplace of REST APIs for the shipping and ocean-tech industry -
  vessel and port lookup from combined satellite and terrestrial AIS, metocean
  (weather and ocean) conditions, per-voyage CO2 emissions modeled on the GLEC
  Framework, ETA prediction, live port congestion, sailing schedules, and
  underwater noise. Every API is called over HTTPS at api.sinay.ai, authenticated
  with a single API_KEY header, and metered as monthly API units / credits with a
  free developer key to start.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Vessel Tracking
- AIS
- Maritime
- Maritime Data
- Weather
- CO2 Emissions
- Port Congestion
- Ship Tracking
- ETA
- Ocean Data
created: '2026-07-12'
modified: '2026-07-12'
specificationVersion: '0.19'
apis:
- aid: sinay:sinay-ports-vessels-api
  name: Sinay Ports and Vessels API
  tags:
  - Vessel Tracking
  - AIS
  - Ports
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sinay.ai/en/sinay-hub/ports-and-vessels-api/
  baseURL: https://api.sinay.ai/ports-vessels/api/v1
  properties:
  - url: https://help.sinay.ai/sinay-apis
    type: Documentation
  - url: https://api.sinay.ai/doc/index.html
    type: APIReference
  - url: openapi/sinay-openapi.yml
    type: OpenAPI
  - url: collections/sinay.postman_collection.json
    type: PostmanCollection
  - url: collections/sinay.opencollection.json
    type: OpenCollection
  description: Look up vessels by name, MMSI, or IMO and ports by name or UN/LOCODE
    from Sinay's maritime reference data, built on combined satellite and
    terrestrial AIS. Returns matching vessel and port records for identification and
    enrichment. GET /vessels, GET /ports, and a /usages endpoint for consumption.
- aid: sinay:sinay-metocean-api
  name: Sinay Metocean API
  tags:
  - Weather
  - Ocean Data
  - Metocean
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sinay.ai/en/sinay-hub/metocean-api/
  baseURL: https://api.sinay.ai/metocean/api/v1
  properties:
  - url: https://help.sinay.ai/sinay-apis
    type: Documentation
  - url: https://api.sinay.ai/doc/index.html
    type: APIReference
  - url: openapi/sinay-openapi.yml
    type: OpenAPI
  - url: collections/sinay.postman_collection.json
    type: PostmanCollection
  - url: collections/sinay.opencollection.json
    type: OpenCollection
  description: Retrieve metocean (meteorological and oceanographic) conditions -
    weather and ocean parameters - for a geographic area and time window from a
    chosen forecast/hindcast model. GET /models lists available models and
    POST /stations returns station data for a GeoJSON area, with /usages for
    consumption.
- aid: sinay:sinay-co2-emission-api
  name: Sinay CO2 Emission API
  tags:
  - CO2 Emissions
  - Sustainability
  - GLEC
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sinay.ai/en/sinay-hub/co2-api/
  baseURL: https://api.sinay.ai/co2/api/v2
  properties:
  - url: https://help.sinay.ai/sinay-apis
    type: Documentation
  - url: https://api.sinay.ai/doc/index.html
    type: APIReference
  - url: openapi/sinay-openapi.yml
    type: OpenAPI
  - url: collections/sinay.postman_collection.json
    type: PostmanCollection
  - url: collections/sinay.opencollection.json
    type: OpenCollection
  description: Compute the CO2 emissions of a container voyage between two ports for
    a given vessel (by IMO or MMSI), returning voyage length in nautical miles and
    tons of CO2 per TEU using two methods - a vessel-model method (Tank-to-Wheel)
    and a GLEC Framework tradelane method (Well-to-Tank, Tank-to-Wheel, and
    Well-to-Wheel). POST /compute-co2 with a /usages endpoint.
- aid: sinay:sinay-eta-api
  name: Sinay ETA API
  tags:
  - ETA
  - Vessel Tracking
  - Predictions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sinay.ai/en/sinay-hub/eta-api/
  baseURL: https://api.sinay.ai/etac/api/v1
  properties:
  - url: https://help.sinay.ai/sinay-apis
    type: Documentation
  - url: https://api.sinay.ai/doc/index.html
    type: APIReference
  - url: openapi/sinay-openapi.yml
    type: OpenAPI
  - url: collections/sinay.postman_collection.json
    type: PostmanCollection
  - url: collections/sinay.opencollection.json
    type: OpenCollection
  description: Predict a vessel's estimated time of arrival (ETA) to a destination
    port. The vessel can be routed from its latest AIS-transmitted position or from
    a specified departure port and date to an arrival port (UN/LOCODE), using AI and
    machine-learning models over real-time awareness and historical data.
    POST /compute-eta with a /usages endpoint.
- aid: sinay:sinay-port-congestion-api
  name: Sinay Port Congestion API
  tags:
  - Port Congestion
  - Ports
  - Maritime Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sinay.ai/en/sinay-hub/port-congestion-api/
  baseURL: https://api.sinay.ai/congestion/api/v1
  properties:
  - url: https://help.sinay.ai/sinay-apis
    type: Documentation
  - url: https://api.sinay.ai/doc/index.html
    type: APIReference
  - url: openapi/sinay-openapi.yml
    type: OpenAPI
  - url: collections/sinay.postman_collection.json
    type: PostmanCollection
  - url: collections/sinay.opencollection.json
    type: OpenCollection
  description: Retrieve aggregated live port congestion data for a single port by
    UN/LOCODE (GET /congestion/{portCode}) or for up to ten ports at once
    (POST /congestion/batch), plus credit-consumption reporting via
    /consumption/current-period and /consumption/periods.
