description: >-
  FinOps view of Sinay Developers Platform spend. Sinay bills a subscription plan
  (Free / Pro / Enterprise) that carries a monthly allowance of API calls / API
  units (credits), consumed across the maritime APIs (Ports & Vessels, Metocean,
  CO2 Emission, ETA, Port Congestion). Different endpoints can consume different
  numbers of API units per call, so cost is driven by call mix as well as call
  volume. Each API reports its own consumption (consumedApiUnits, credit periods)
  which is the primary signal for cost visibility.
notes: >-
  Per-unit prices, currency, and per-endpoint credit weightings are not
  reconciled here; verify on the Sinay Developers Platform pricing page. Sinay is
  France-based, so billing currency may be EUR - confirm on reconciliation.
