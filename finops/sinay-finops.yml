meters:
- name: api_units
  description: API units / credits consumed across Sinay APIs; reported per month as consumedApiUnits per product.
  unit: api_units
  aggregation: sum
  dimensions:
  - account
  - api
- name: api_calls
  description: Number of API calls made against the monthly plan allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
  - endpoint
- name: congestion_credits
  description: Credits consumed by the Port Congestion API, reported via /consumption periods.
  unit: credits
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Poll each API's /usages endpoint (consumedApiUnits) and the congestion /consumption endpoints to track monthly burn per product.
- name: Allocation
  description: Issue separate API keys per workload/team so consumption maps to internal cost centers.
- name: Optimization
  description: Batch where possible (e.g. congestion /batch for up to 10 ports), cache stable reference lookups (ports/vessels), and pick the plan tier that matches monthly call volume to avoid overage.
- name: Accountability
  description: Assign an owner per key; review monthly consumedApiUnits against the plan allowance and upgrade/downgrade tier accordingly.
